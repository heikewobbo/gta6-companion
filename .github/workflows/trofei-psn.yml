name: Trofei PSN

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora
  workflow_dispatch:        # anche a mano, da Actions > Trofei PSN > Run workflow

permissions:
  contents: write

concurrency:
  group: trofei-psn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa psn-api
        run: npm install --no-save --no-package-lock psn-api@2.18.0
      - name: Legge i trofei
        run: node tools/psn-sync.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
      - name: Salva i cambiamenti
        run: |
          git config user.name "trofei-bot"
          git config user.email "trofei-bot@users.noreply.github.com"
          git add psn
          git diff --cached --quiet || (git commit -m "Trofei PSN aggiornati" && git push)
